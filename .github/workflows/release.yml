name: Release

# Builds the clean single-file editor exactly like build-clean.bat does in the repository folder
# and publishes it as a GitHub release inside SA Map Studio.zip (the executable is analyzed by VirusTotal).
# Releases are always started by hand: Actions > Release > Run workflow (the tag v<VERSION> is created by it).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Read the editor version
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path serve.py -Pattern '^VERSION\s*=\s*"(\d+\.\d+\.\d+)"'
          if (-not $m) { throw "VERSION not found in serve.py" }
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build (build-clean.bat)
        shell: cmd
        env:
          NO_PAUSE: "1"
        run: call build-clean.bat

      - name: Check the executable
        shell: pwsh
        run: |
          $exe = "compiled\SA Map Studio\SA Map Studio.exe"
          if (-not (Test-Path $exe)) { throw "Executable was not generated" }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      - name: Pack the executable in a zip
        shell: pwsh
        run: |
          # The executable keeps its name with spaces inside the zip
          Compress-Archive -Path "compiled\SA Map Studio\SA Map Studio.exe" -DestinationPath "compiled\SA Map Studio.zip" -Force
          "{0:N1} MB" -f ((Get-Item "compiled\SA Map Studio.zip").Length / 1MB)

      - name: Write the release notes
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $lines = (Get-Content readme.md -Encoding utf8) -replace "`r$", ""
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^### $([regex]::Escape($v)) ") { $start = $i; break }
          }
          if ($start -lt 0) { throw "No section for version $v in the Version history of readme.md" }
          $body = @()
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^### " -or $lines[$i] -match "^</details>") { break }
            $body += $lines[$i]
          }
          $body = ($body -join "`n").Trim()
          if (-not $body) { throw "The section of version $v in readme.md is empty" }
          # Up to 5000 characters the changelog shows open; a longer one goes inside a spoiler
          if ($body.Length -gt 5000) {
            $notes = "<details>`n<summary>Changelog of v$v</summary>`n`n$body`n`n</details>"
          } else {
            $notes = $body
          }
          # Hashes of the zip and of the executable inside it, plus the VirusTotal report of the executable
          $hash = (Get-FileHash "compiled\SA Map Studio\SA Map Studio.exe" -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash "compiled\SA Map Studio.zip" -Algorithm SHA256).Hash.ToLower()
          $notes += "`n`n---`n`n**Verify the download**`n`n"
          $notes += "SHA-256 of ``SA Map Studio.zip``: ``$zipHash```n`n"
          $notes += "SHA-256 of ``SA Map Studio.exe`` (inside the zip): ``$hash```n`n"
          $notes += "VirusTotal report of the executable: https://www.virustotal.com/gui/file/$hash"
          [System.IO.File]::WriteAllText((Join-Path $PWD "release-notes.md"), $notes, (New-Object System.Text.UTF8Encoding($false)))

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          # GitHub turns spaces in asset file names into dots; the label after # is the name shown on the release page
          $zip = "compiled\SA Map Studio.zip#SA Map Studio.zip"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip --clobber
            gh release edit $tag --notes-file release-notes.md
          } else {
            gh release create $tag $zip --target $env:GITHUB_SHA --title "SA Map Studio $tag" --notes-file release-notes.md
          }

      # Sends the executable (not the zip, so its hash matches the link) to VirusTotal so the link in the release notes already opens with the report.
      # Needs the repository secret VT_API_KEY (free VirusTotal account); without it this step is skipped.
      - name: Send the executable to VirusTotal
        if: ${{ env.VT_API_KEY != '' }}
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "compiled\SA Map Studio\SA Map Studio.exe"
          # Files over 32 MB go through a one-time upload URL
          $url = (curl.exe -s -H "x-apikey: $env:VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | ConvertFrom-Json).data
          if (-not $url) { throw "VirusTotal did not return an upload URL" }
          $r = curl.exe -s -H "x-apikey: $env:VT_API_KEY" -F "file=@$exe" $url | ConvertFrom-Json
          if (-not $r.data.id) { throw "VirusTotal upload failed" }
          "Sent to VirusTotal: $($r.data.id)"
