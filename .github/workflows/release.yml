name: Release

# Builds the clean single-file editor exactly like build-clean.bat does in the repository folder
# and publishes SA Map Studio.exe as a GitHub release.
# Releases are always started by hand: Actions > Release > Run workflow (the tag v<VERSION> is created by it).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Read the editor version
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path serve.py -Pattern '^VERSION\s*=\s*"(\d+\.\d+\.\d+)"'
          if (-not $m) { throw "VERSION not found in serve.py" }
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build (build-clean.bat)
        shell: cmd
        env:
          NO_PAUSE: "1"
        run: call build-clean.bat

      - name: Check the executable
        shell: pwsh
        run: |
          $exe = "compiled\SA Map Studio\SA Map Studio.exe"
          if (-not (Test-Path $exe)) { throw "Executable was not generated" }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      - name: Write the release notes
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $lines = (Get-Content readme.md -Encoding utf8) -replace "`r$", ""
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^### $([regex]::Escape($v)) ") { $start = $i; break }
          }
          if ($start -lt 0) { throw "No section for version $v in the Version history of readme.md" }
          $body = @()
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^### " -or $lines[$i] -match "^</details>") { break }
            $body += $lines[$i]
          }
          $body = ($body -join "`n").Trim()
          if (-not $body) { throw "The section of version $v in readme.md is empty" }
          # Up to 5000 characters the changelog shows open; a longer one goes inside a spoiler
          if ($body.Length -gt 5000) {
            $notes = "<details>`n<summary>Changelog of v$v</summary>`n`n$body`n`n</details>"
          } else {
            $notes = $body
          }
          [System.IO.File]::WriteAllText((Join-Path $PWD "release-notes.md"), $notes, (New-Object System.Text.UTF8Encoding($false)))

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $exe = "compiled\SA Map Studio\SA Map Studio.exe"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $exe --clobber
            gh release edit $tag --notes-file release-notes.md
          } else {
            gh release create $tag $exe --target $env:GITHUB_SHA --title "SA Map Studio $tag" --notes-file release-notes.md
          }
