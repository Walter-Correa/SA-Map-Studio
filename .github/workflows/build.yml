name: Build

# Checks every push to main: the translations are complete and the clean single-file editor still builds,
# exactly like build-clean.bat does in the repository folder. Nothing is published (releases come from Release).
on:
  push:
    branches: [main]
    paths-ignore:
      - "readme.md"
      - "README.md"
      - "ia-rules.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the build of an older one that is still running
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check the translations (i18n_check.py)
        shell: cmd
        env:
          PYTHONIOENCODING: utf-8
        run: python compile-sources\i18n_check.py

      - name: Build (build-clean.bat)
        shell: cmd
        env:
          NO_PAUSE: "1"
        run: call build-clean.bat

      - name: Check the executable
        shell: pwsh
        run: |
          $exe = "compiled\SA Map Studio\SA Map Studio.exe"
          if (-not (Test-Path $exe)) { throw "Executable was not generated" }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      - name: Keep the executable for download
        uses: actions/upload-artifact@v5
        with:
          name: SA Map Studio (${{ github.sha }})
          path: compiled/SA Map Studio/SA Map Studio.exe
          retention-days: 7
